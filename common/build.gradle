def protocolVersion = protocols_use_local_build == "true" ? protocols_local_version : protocols_version

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    compileOnly("org.spongepowered:mixin:0.8.7")
    compileOnly("org.ow2.asm:asm-tree:9.6")
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly("io.github.llamalad7:mixinextras-common:0.4.1")
    annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1")

    modApi("maven.modrinth:entity-model-features:pvyci2Ch")
    modApi("maven.modrinth:entitytexturefeatures:dP1ZqaGp")

    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    implementation("me.shedaniel.cloth:cloth-config-neoforge:${clothconfig_version}")

    implementation("com.github.NiFeather:feathermorph-protocols:${protocolVersion}")
    implementation("com.github.NiFeather:feathermorph-command-compat-layer:${compat_layer_version}")
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}